<style>
/* Layout: one narrow column for a phone held in a store aisle; sticky tab bar + progress; big tap targets. */
:root{
  --bg:#13110f;--card:#1c1916;--card2:#24201c;--fg:#f3ece2;--muted:#ab9f91;--accent:#e3aa63;--ok:#8fbf8a;--line:rgba(243,236,226,.12);
  --display:'Sora',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
header.top{padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:6px;display:flex;flex-direction:column;gap:6px}
h1{font:600 22px/1.2 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
.sub a{color:var(--accent)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.tabs{display:flex;background:var(--card);border-radius:999px;padding:3px;gap:2px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:9px 10px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.prog{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog b{color:var(--fg)}
.meter{height:6px;background:rgba(243,236,226,.1);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#f0c48a);border-radius:99px;transition:width .3s}
section.shop{margin-top:22px}
.shop-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shop-head h2{font:600 17px var(--display);margin:0}
.shop-head span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{margin:4px 0 10px;color:var(--muted);font-size:13px}
.hint.warn{color:#f2b36f}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px 13px;align-items:start}
.item input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:7px;border:2px solid rgba(243,236,226,.35);margin:1px 0 0;cursor:pointer;display:grid;place-items:center;background:transparent}
.item input:checked{background:var(--ok);border-color:var(--ok)}
.item input:checked::after{content:"";width:7px;height:12px;border:solid #13110f;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item label{min-width:0;cursor:pointer}
.item .n{font-weight:500}
.item .v{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.item .meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;font-size:12px;color:var(--muted)}
.item .nr{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg);background:var(--card2);padding:1px 7px;border-radius:5px;letter-spacing:.02em}
.item .room{color:var(--muted)}
.item a{color:var(--accent);text-decoration:none}
.item .p{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .p small{display:block;color:var(--muted);font-size:11.5px}
.item.done{opacity:.5}
.item.done .n{text-decoration:line-through}
.total{margin-top:26px;background:var(--card);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums;font-size:14px}
.total div{display:flex;justify-content:space-between;gap:10px}
.total .big{font:600 18px var(--body)}
.total .ok{color:var(--ok)}
/* plan tab */
.phase{margin-top:22px;border-left:3px solid var(--accent);padding-left:14px}
.phase .when{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.phase h2{font:600 17px var(--display);margin:2px 0 6px}
.phase ol,.phase ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.phase li{padding-left:2px}
.phase p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.chip.done{border-color:var(--ok);color:var(--ok)}
.rule{margin-top:22px;background:var(--card);border-radius:14px;padding:14px 16px}
.rule h2{font:600 16px var(--display);margin:0 0 6px}
.rule ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.reset{margin-top:22px;background:transparent;border:1px solid var(--line);color:var(--muted);font:500 13px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>

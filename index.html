<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}body{font:14px system-ui,sans-serif}</style>
<title>Wohnungsplan mit Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: the 3D flat fills the screen; smoked-glass panels float at the edges; a shopping-list drawer slides in from the right (bottom sheet on phones). */
:root{
  --bg:#110f0d;
  --panel:rgba(24,20,17,.84);
  --panel-solid:#1a1714;
  --fg:#f3ece2;
  --muted:#ac9f90;
  --accent:#e3aa63;
  --ok:#8fbf8a;
  --line:rgba(243,236,226,.14);
  --display:'Sora',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#c.dragging{cursor:grabbing}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.glass{background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card{pointer-events:auto;border-radius:14px;padding:13px 16px 14px;max-width:350px;min-width:0;display:flex;flex-direction:column;gap:8px}
.card h1{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.meta{margin:0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.budget{display:flex;flex-direction:column;gap:5px}
.bar{height:6px;border-radius:99px;background:rgba(243,236,226,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f0c48a);border-radius:99px}
.budget-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.budget-row b{color:var(--fg);font-weight:600}
.room{border-top:1px solid var(--line);padding-top:9px;display:flex;flex-direction:column;gap:4px}
.room-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.room-name{font-family:var(--display);font-weight:600;font-size:14.5px}
.room-dims{font-size:12.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.room-items{font-size:12.5px;line-height:1.45;color:var(--muted);margin:0}
.btn{font:500 12.5px var(--body);color:var(--bg);background:var(--accent);border:0;border-radius:999px;padding:7px 13px;cursor:pointer;align-self:flex-start}
#map{pointer-events:auto;border-radius:12px;width:176px;height:154px;flex:none;cursor:pointer}
.bottom{display:flex;flex-direction:column;gap:10px;align-items:center}
.hint{font-size:12.5px;color:var(--fg);border-radius:999px;padding:7px 14px;transition:opacity .5s;text-align:center}
.hint.off{opacity:0}
.rooms{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;font:500 13.5px var(--body);color:var(--fg);border-radius:999px;padding:9px 14px;cursor:pointer}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip small{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:rgba(227,170,99,.2);border-color:var(--accent)}
.toggles{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seg{display:inline-flex;border-radius:999px;padding:3px;gap:2px}
.seg button{font:500 13px var(--body);color:var(--muted);background:transparent;border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
#listBtn{font:600 13px var(--body);color:var(--bg);background:var(--accent);border:0;border-radius:999px;padding:9px 16px;cursor:pointer;font-variant-numeric:tabular-nums}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#labels{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border-radius:10px;padding:5px 10px;font-size:12px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.lbl b{font-family:var(--display);font-weight:600;font-size:12.5px}
.lbl span{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
/* product popup */
#pop{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);width:min(360px,calc(100vw - 32px));border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:6px;pointer-events:auto;z-index:5}
#pop .shop{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
#pop h2{font:600 15px var(--display);margin:0}
#pop .var{font-size:12.5px;color:var(--muted);margin:0}
#pop .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
#pop .price{font:600 16px var(--body);font-variant-numeric:tabular-nums}
#pop a{color:var(--bg);background:var(--fg);text-decoration:none;font:500 12.5px var(--body);padding:7px 12px;border-radius:999px}
#pop .x{position:absolute;top:8px;right:8px;background:transparent;border:0;color:var(--muted);font-size:18px;cursor:pointer;width:30px;height:30px;border-radius:50%}
/* shopping drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:8;display:flex;flex-direction:column;border-radius:0;border-width:0 0 0 1px;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:18px;background:var(--panel-solid)}
#drawer header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
#drawer h2{font:600 18px var(--display);margin:0 0 4px}
#drawer .close{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:6px 12px;font:500 12.5px var(--body);cursor:pointer}
#drawer .scroll{overflow-y:auto;flex:1;min-height:0;padding:6px 2px 10px}
.grp{padding:12px 0 6px;border-bottom:1px solid var(--line)}
.grp h3{display:flex;justify-content:space-between;align-items:baseline;font:600 14px var(--display);margin:0 0 8px}
.grp h3 span{font:500 12.5px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:7px 0;font-size:13px}
.it .n{min-width:0}
.it .n b{font-weight:500}
.it .n small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.it .p{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.it .p small{display:block;color:var(--muted);font-size:11px}
.it a{grid-column:1/-1;justify-self:start;font-size:11.5px;color:var(--accent);text-decoration:none}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.tag.ikea{background:rgba(227,170,99,.18);color:var(--accent)}
.tag.mm{background:rgba(220,90,80,.18);color:#f08f86}
.tag.saturn{background:rgba(240,150,60,.18);color:#f5b26b}
.tag.poco{background:rgba(120,170,230,.18);color:#9cc3f0}
.tag.otto{background:rgba(230,110,110,.18);color:#f29b9b}
.tag.kabs{background:rgba(143,191,138,.18);color:var(--ok)}
.sum{padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font:600 17px var(--body)}
.sum .rest{color:var(--ok)}
.note{font-size:11.5px;color:var(--muted);line-height:1.45;margin:8px 0 0}
#fade{position:fixed;inset:0;background:#0b0908;opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:6}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:500 14px var(--body);color:var(--muted)}
@media (max-width:560px){
  #shopsTop,.room-items{display:none}
  .seg button{padding:6px 10px;font-size:12px}
  #listBtn{padding:7px 12px;font-size:12px}
  .toggles{gap:6px}
  .hint{font-size:11.5px;padding:6px 12px}
  .card{max-width:none;flex:1;padding:11px 13px}
  .card h1{font-size:15px}
  .room-items{font-size:12px}
  #map{width:110px;height:96px}
  .chip{padding:8px 12px;font-size:13px}
  #drawer{top:auto;height:82vh;width:100vw;border-width:1px 0 0;border-radius:16px 16px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px))}
  #pop{bottom:calc(env(safe-area-inset-bottom,0px) + 170px)}
}
@media (prefers-reduced-motion:reduce){#fade,.hint{transition:none}}
</style>

</div>
<section id="pop" class="glass" hidden aria-live="polite">

  <span class="shop" id="pShop"></span>
  <h2 id="pName"></h2>

</section>
<aside id="drawer" class="glass" hidden aria-label="Einkaufsliste">
  <header>
    <div><h2>Einkaufsliste</h2><p class="meta" style="margin:0 0 4px"><a href="zettel.html" style="color:var(--accent)">Einkaufszettel &amp; Reihenfolge zum Abhaken ↗</a></p><p class="meta" id="dMeta"></p></div>
    <button class="close" id="dClose">Schließen</button>
  </header>
  <div class="scroll" id="dList"></div>
</aside>

  else{st.theta-=dx*.006;st.phi=Math.max(.12,Math.min(1.22,st.phi-dy*.005));applyPose(topPose());}});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(drag&&ptrs.size===0){if(drag.moved<8&&performance.now()-drag.t<500)tap(e.clientX,e.clientY);drag=null;}if(ptrs.size===0)canvas.classList.remove('dragging');}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{e.preventDefault();hideHint();tween=null;
  if(st.mode==='top'){st.radius=Math.max(3.5,Math.min(34,st.radius*Math.exp(e.deltaY*.0012)));applyPose(topPose());}
  else{const s=-Math.sign(e.deltaY)*.35;tryMove(-Math.sin(st.yaw)*s,-Math.cos(st.yaw)*s);applyPose(walkPose());}},{passive:false});
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
const marker=new THREE.Mesh(new THREE.RingGeometry(.13,.17,40).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:'#e3aa63',transparent:true,opacity:0,depthWrite:false}));
marker.position.y=.02;marker.raycast=noPick;marker.userData.fx=true;scene.add(marker);let markerT=0;
function visibleChain(o){while(o){if(!o.visible)return false;o=o.parent;}return true;}
function pidOf(o){while(o){if(o.userData&&o.userData.pid)return o.userData.pid;o=o.parent;}return null;}
function tap(cx,cy){ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(scene.children,true).filter(h=>visibleChain(h.object)&&!(st.mode==='top'&&h.point.y>1.55));if(!hits.length)return;const h0=hits[0],p=h0.point;
  const pid=pidOf(h0.object);if(pid&&PROD[pid]&&!h0.object.userData.floor){showPop(pid);return;}hidePop();
  if(st.mode==='top'){const id=roomAt(p.x,p.z);if(id)goRoom(id);return;}
  let x=p.x,z=p.z;if(!walkable(x,z)){const dx=x-st.pos.x,dz=z-st.pos.z,L=Math.hypot(dx,dz);let ok=false;
    for(let t=L-.2;t>.3;t-=.1){const xx=st.pos.x+dx/L*t,zz=st.pos.z+dz/L*t;if(walkable(xx,zz)){x=xx;z=zz;ok=true;break;}}if(!ok)return;}
  marker.position.x=x;marker.position.z=z;markerT=performance.now();
  let clear=true;const L=Math.hypot(x-st.pos.x,z-st.pos.z);for(let t=0;t<=1;t+=.1/Math.max(L,.1))if(!walkable(st.pos.x+(x-st.pos.x)*t,st.pos.z+(z-st.pos.z)*t)){clear=false;break;}
  if(clear){st.pos.set(x,EYE,z);tweenTo(walkPose(),Math.min(1400,300+L*380));}else fadeTo(()=>{st.pos.set(x,EYE,z);tween=null;applyPose(walkPose());});setRoom(roomAt(x,z));}
function tryMove(dx,dz){const nx=st.pos.x+dx,nz=st.pos.z+dz;if(walkable(nx,nz)){st.pos.x=nx;st.pos.z=nz;}else if(walkable(nx,st.pos.z))st.pos.x=nx;else if(walkable(st.pos.x,nz))st.pos.z=nz;}

/* ---------------- loop ---------------- */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;setFov();if(composer){composer.setSize(innerWidth,innerHeight);}if(!tween)applyPose(st.mode==='walk'?walkPose():topPose());}
addEventListener('resize',resize);
let last=performance.now(),frame=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;frame++;
  if(st.mode==='walk'&&keys.size){tween=null;const sp=1.7*dt,f=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0),sd=(keys.has('d')?1:0)-(keys.has('a')?1:0),turn=(keys.has('arrowleft')||keys.has('q')?1:0)-(keys.has('arrowright')||keys.has('e')?1:0);
    st.yaw+=turn*1.8*dt;const fx=-Math.sin(st.yaw),fz=-Math.cos(st.yaw),rx=Math.cos(st.yaw),rz=-Math.sin(st.yaw);if(f||sd)tryMove((fx*f+rx*sd)*sp,(fz*f+rz*sd)*sp);applyPose(walkPose());const r=roomAt(st.pos.x,st.pos.z);if(r)setRoom(r);}
  if(tween){const k=Math.min(1,(now-tween.t0)/tween.dur),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;camera.position.lerpVectors(tween.p0,tween.P.p,e);camera.quaternion.copy(tween.q0).slerp(tween.P.q,e);if(k>=1){const d=tween.done;tween=null;d&&d();}}
  if(markerT){const a=(now-markerT)/900;marker.material.opacity=a<1?.9*(1-a):0;if(a>=1)markerT=0;}
  updateLabels();if(frame%3===0)drawMap();
  if(composer)composer.render();else renderer.render(scene,camera);requestAnimationFrame(loop);}
const hashMap={};for(const id of ORDER)hashMap[ROOMS[id].key]=id;
function fromHash(){const h=(location.hash||'').slice(1);if(h==='von-oben'){setMode('top');return;}const id=hashMap[h];if(id){const v=ROOMS[id].view;st.pos.set(v.x,EYE,v.z);st.yaw=lookAtYaw(v);if(st.mode==='walk')applyPose(walkPose());setRoom(id,true);}}
addEventListener('hashchange',fromHash);
st.yaw=lookAtYaw(ROOMS.wohn.view);setMood('eve');resize();fromHash();applyPose(st.mode==='walk'?walkPose():topPose());updateCard();
document.getElementById('loading').remove();requestAnimationFrame(loop);
</script>

<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}body{font:14px system-ui,sans-serif}</style>
<title>Unsere neue Wohnung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: the 3D apartment fills the screen; small smoked-glass panels float at the edges like lamps in a dark room. */
:root{
  --bg:#110f0d;
  --panel:rgba(24,20,17,.82);
  --panel-hi:rgba(255,236,210,.07);
  --fg:#f3ece2;
  --muted:#ac9f90;
  --accent:#e3aa63;
  --line:rgba(243,236,226,.14);
  --display:'Sora',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#c.dragging{cursor:grabbing}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.glass{background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card{pointer-events:auto;border-radius:14px;padding:13px 16px 14px;max-width:340px;min-width:0;display:flex;flex-direction:column;gap:8px}
.card h1{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.meta{margin:0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.room{border-top:1px solid var(--line);padding-top:9px;display:flex;flex-direction:column;gap:4px}
.room-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.room-name{font-family:var(--display);font-weight:600;font-size:14.5px}
.room-dims{font-size:12.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.room-items{font-size:12.5px;line-height:1.45;color:var(--muted);margin:0}
#enter{align-self:flex-start;margin-top:4px;font:500 12.5px var(--body);color:var(--bg);background:var(--accent);border:0;border-radius:999px;padding:7px 13px;cursor:pointer}
#map{pointer-events:auto;border-radius:12px;width:176px;height:154px;flex:none;cursor:pointer}
.bottom{display:flex;flex-direction:column;gap:10px;align-items:center}
.hint{font-size:12.5px;color:var(--fg);border-radius:999px;padding:7px 14px;transition:opacity .5s;text-align:center}
.hint.off{opacity:0}
.rooms{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;font:500 13.5px var(--body);color:var(--fg);border-radius:999px;padding:9px 14px;cursor:pointer}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip small{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:rgba(227,170,99,.2);border-color:var(--accent)}
.toggles{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seg{display:inline-flex;border-radius:999px;padding:3px;gap:2px}
.seg button{font:500 13px var(--body);color:var(--muted);background:transparent;border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#labels{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border-radius:10px;padding:5px 10px;font-size:12px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.lbl b{font-family:var(--display);font-weight:600;font-size:12.5px}
.lbl span{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
#fade{position:fixed;inset:0;background:#0b0908;opacity:0;pointer-events:none;transition:opacity .22s ease}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:500 14px var(--body);color:var(--muted)}
@media (max-width:560px){
  .card{max-width:none;flex:1;padding:11px 13px}
  .card h1{font-size:15px}
  .room-items{font-size:12px}
  #map{width:118px;height:103px}
  .chip{padding:8px 12px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){#fade,.hint{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="3D-Ansicht der Wohnung"></canvas>
<div id="loading">Wohnung wird aufgebaut …</div>
<div id="labels"></div>
<div id="ui">
  <div class="top">
    <section class="card glass" aria-live="polite">
      <div>
        <h1>Unsere neue Wohnung</h1>
        <p class="meta">Dachgeschoss · 6 Räume · ca. 56 m² Grundfläche</p>
      </div>
      <div class="room">
        <div class="room-head"><span class="room-name" id="rName">Wohnzimmer</span><span class="room-dims" id="rDims"></span></div>
        <p class="room-items" id="rItems"></p>
        <button id="enter" hidden>Rundgang hier starten</button>
      </div>
    </section>
    <canvas id="map" class="glass" aria-label="Grundriss – antippen, um dorthin zu gehen"></canvas>
  </div>
  <div class="bottom">
    <div class="hint glass" id="hint">Ziehen zum Umschauen · auf den Boden tippen zum Hinlaufen · WASD / Pfeiltasten</div>
    <nav class="rooms" id="rooms" aria-label="Räume"></nav>
    <div class="toggles">
      <div class="seg glass" id="modeSeg" role="group" aria-label="Ansicht">
        <button id="mWalk" aria-pressed="true">Rundgang</button>
        <button id="mTop" aria-pressed="false">Von oben</button>
      </div>
      <div class="seg glass" id="moodSeg" role="group" aria-label="Licht">
        <button id="lEve" aria-pressed="true">Abend</button>
        <button id="lDay" aria-pressed="false">Tag</button>
      </div>
    </div>
  </div>
</div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const H=2.45, T=0.05, EYE=1.6;

const canvas=document.getElementById('c');

/* ---------- procedural textures ---------- */
let _s=20261126; const rnd=()=>{_s=(_s*16807)%2147483647;return (_s-1)/2147483646;};

  const rows=10,rh=S/rows;

    while(x<S){const len=S*(.5+rnd()*.25);const l=146+rnd()*28;const col=`rgb(${l+11|0},${l+2|0},${l-11|0})`;
      for(const o of [0,-S]){const px=x+o;if(px+len<0||px>S)continue;
        g.save();g.beginPath();g.rect(px,y,len,rh);g.clip();g.fillStyle=col;g.fillRect(px,y,len,rh);
        for(let i=0;i<34;i++){const yy=y+rnd()*rh;g.strokeStyle=rnd()<.55?`rgba(84,70,58,${.05+rnd()*.1})`:`rgba(242,232,216,${.04+rnd()*.07})`;
          g.lineWidth=.6+rnd()*1.8;g.beginPath();g.moveTo(px,yy);g.bezierCurveTo(px+len*.3,yy+(rnd()-.5)*7,px+len*.65,yy+(rnd()-.5)*7,px+len,yy+(rnd()-.5)*4);g.stroke();}
        g.fillStyle='rgba(58,48,40,.5)';g.fillRect(px,y,2,rh);g.fillRect(px,y,len,1.5);g.restore();}
      x+=len;}}
  return c;}
function walnutCanvas(){const S=512,c=mk(S,S),g=c.getContext('2d');g.fillStyle='#5d3e2a';g.fillRect(0,0,S,S);
  for(let i=0;i<300;i++){const x=rnd()*S,a=.06+rnd()*.15;g.strokeStyle=rnd()<.55?`rgba(32,18,10,${a})`:`rgba(156,110,72,${a})`;
    g.lineWidth=1+rnd()*3;g.beginPath();g.moveTo(x,0);const k=(rnd()-.5)*22;g.bezierCurveTo(x+k,S*.33,x-k,S*.66,x,S);g.stroke();}
  return c;}

  for(let i=0;i<S*S;i++){let v=base+(rnd()-.5)*amp;if(weave){const x=i%S,y=(i/S)|0;v+=(((x>>1)+(y>>1))%2?5:-5)*weave;}
    v=Math.max(0,Math.min(255,v));id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255;}
  g.putImageData(id,0,0);return c;}

  const tw=S/cols,th=S/rows;

    g.fillRect(q*tw+2,r*th+2,tw-4,th-4);
    for(let k=0;k<50;k++){g.fillStyle=`rgba(${rnd()<.5?'255,255,255':'120,100,80'},${rnd()*.05})`;g.beginPath();g.arc(q*tw+2+rnd()*(tw-4),r*th+2+rnd()*(th-4),2+rnd()*9,0,7);g.fill();}}
  return c;}
function radCanvas(){const c=mk(64,64),g=c.getContext('2d'),gr=g.createLinearGradient(0,0,64,0);
  gr.addColorStop(0,'#b9b5ae');gr.addColorStop(.25,'#f3f1ec');gr.addColorStop(.7,'#e7e4de');gr.addColorStop(1,'#9f9b94');g.fillStyle=gr;g.fillRect(0,0,64,64);return c;}
function slatCanvas(){const c=mk(64,64),g=c.getContext('2d'),gr=g.createLinearGradient(0,0,64,0);
  gr.addColorStop(0,'#2b1a10');gr.addColorStop(.18,'#6a4630');gr.addColorStop(.8,'#5a3a26');gr.addColorStop(1,'#24150d');g.fillStyle=gr;g.fillRect(0,0,64,64);return c;}
function artCanvas(seed){const c=mk(256,340),g=c.getContext('2d');g.fillStyle='#e9e1d3';g.fillRect(0,0,256,340);
  for(let i=0;i<9;i++){const y0=20+i*38+seed*11;g.strokeStyle=`rgba(150,128,104,${.18+i%3*.06})`;g.lineWidth=10;g.beginPath();g.moveTo(-10,y0);
    g.bezierCurveTo(80,y0-50+seed*20,170,y0+60,270,y0-10);g.stroke();g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=3;g.stroke();}
  return c;}
function skyCanvas(day){const c=mk(256,256),g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);
  if(day){gr.addColorStop(0,'#8fb8de');gr.addColorStop(.65,'#d8e6ef');gr.addColorStop(1,'#eef1ef');}
  else{gr.addColorStop(0,'#111b33');gr.addColorStop(.55,'#2a4675');gr.addColorStop(1,'#6f7590');}
  g.fillStyle=gr;g.fillRect(0,0,256,256);
  g.fillStyle=day?'#6c7d5c':'#0d1315';g.beginPath();g.moveTo(0,256);
  for(let x=0;x<=256;x+=6)g.lineTo(x,178+Math.sin(x*.06)*13+rnd()*16);g.lineTo(256,256);g.fill();
  if(!day){g.fillStyle='rgba(255,236,205,.9)';g.beginPath();g.arc(186,150,3.5,0,7);g.fill();
    for(let i=0;i<5;i++){g.fillStyle='rgba(255,200,130,.8)';g.fillRect(30+i*45,205+rnd()*20,3,3);}}
  return c;}
function glowRCanvas(){const c=mk(128,128),g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,'rgba(255,255,255,.5)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return c;}
function glowLCanvas(){const c=mk(128,256),g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.22,'rgba(255,255,255,.5)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,256);
  g.globalCompositeOperation='destination-in';const h=g.createLinearGradient(0,0,128,0);
  h.addColorStop(0,'rgba(0,0,0,0)');h.addColorStop(.14,'rgba(0,0,0,1)');h.addColorStop(.86,'rgba(0,0,0,1)');h.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=h;g.fillRect(0,0,128,256);return c;}

const TX={
  floor:tex(floorCanvas(),2), walnut:tex(walnutCanvas(),1), fabric:tex(noiseCanvas(256,226,40,1),.25),
  rug:tex(noiseCanvas(256,205,95,0),.6), tileW:tex(tileCanvas(2,4,[220,203,180]),1.2), tileF:tex(tileCanvas(2,2,[212,196,174]),1.2),
  rad:tex(radCanvas(),[.05,1]), slat:tex(slatCanvas(),[.03,1]), art1:tex(artCanvas(0)), art2:tex(artCanvas(1)),
  skyE:tex(skyCanvas(false)), skyD:tex(skyCanvas(true)), gR:tex(glowRCanvas(),0,false), gL:tex(glowLCanvas(),0,false)

TX.gR.wrapS=TX.gR.wrapT=TX.gL.wrapS=TX.gL.wrapT=THREE.ClampToEdgeWrapping;

/* ---------- materials ---------- */
const DS=THREE.DoubleSide;

const M={
  wall:std('#ece6dd',{r:.95}), ceil:std('#f1ede7',{r:1}), slope:std('#eee8e0',{r:1,side:DS}),
  floor:std('#ffffff',{map:TX.floor,r:.5}), tileW:std('#ffffff',{map:TX.tileW,r:.35}), tileF:std('#ffffff',{map:TX.tileF,r:.45}),
  walnut:std('#ffffff',{map:TX.walnut,r:.55}), walnutD:std('#857266',{map:TX.walnut,r:.55}), slat:std('#ffffff',{map:TX.slat,r:.6}),
  black:std('#1f1d1c',{r:.6}), frame:std('#f3f1ec',{r:.4}), sill:std('#e9e5de',{r:.3}), rad:std('#ffffff',{map:TX.rad,r:.4}),
  blind:std('#d6c9b6',{map:TX.fabric,r:1,side:DS}), sofa:std('#44403d',{map:TX.fabric,r:1}), bedF:std('#9b968f',{map:TX.fabric,r:1}),
  linen:std('#f2eee7',{map:TX.fabric,r:1}), cream:std('#dccfbb',{map:TX.fabric,r:1}), brown:std('#7f5f48',{map:TX.fabric,r:1}),
  greige:std('#a69887',{map:TX.fabric,r:1}), chairF:std('#5e5a56',{map:TX.fabric,r:1,side:DS}), boucle:std('#6b5b4f',{map:TX.fabric,r:1}),
  lightSofa:std('#c9bcaa',{map:TX.fabric,r:1}),
  rug:std('#d0c3af',{map:TX.rug,r:1}), runner:std('#d8cdbe',{map:TX.rug,r:1}), jute:std('#b8966a',{map:TX.rug,r:1}),
  ceramic:std('#f8f7f4',{r:.12}), metal:std('#1b1b1b',{r:.35,m:.7}), brass:std('#c49b60',{r:.3,m:.85}), screen:std('#0a0b0d',{r:.1,m:.6}),
  felt:std('#1b1714',{r:1}), green:std('#26393a',{r:.95}), accentBed:std('#3d3935',{r:.95}), stone:std('#3c3936',{r:.35}),
  leaf:std('#4a6c3b',{r:.7,side:DS}), leafD:std('#355230',{r:.7,side:DS}), olive:std('#4c5838',{r:.85}), pot:std('#2d2724',{r:.65}),
  potLight:std('#d9d1c5',{r:.7}), doorDark:std('#3e3d3b',{r:.5}), white:std('#f2f0ec',{r:.35}), hydr:std('#f0e7d7',{r:.9}),
  smoke:std('#5c4737',{r:.08,m:.3,t:.62,e:'#ffae5c',ei:.6}), paper:std('#f6ead6',{r:1,e:'#ffc983',ei:1.1}),
  mirror:std('#b4b6b5',{r:.03,m:.92}), glass:std('#d6e4e8',{r:.05,m:.1,t:.16}), candle:std('#efe6d8',{r:.8}),
  art1:std('#ffffff',{map:TX.art1,r:.9}), art2:std('#ffffff',{map:TX.art2,r:.9}),
  led:new THREE.MeshBasicMaterial({color:'#ffc681'}), bulb:new THREE.MeshBasicMaterial({color:'#ffe0ad'}),
  flame:new THREE.MeshBasicMaterial({color:'#ffcf73'}), ring:new THREE.MeshBasicMaterial({color:'#ffd7a0'}),
  sky:new THREE.MeshBasicMaterial({map:TX.skyE,side:DS}), shadow:new THREE.MeshBasicMaterial({color:'#000000',map:TX.gR,transparent:true,opacity:.35,depthWrite:false})

/* ---------- environment (soft reflections) ---------- */
const pmrem=new THREE.PMREMGenerator(renderer);
function makeEnv(day){const s=new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(12,5,12),new THREE.MeshBasicMaterial({color:day?'#b9b3aa':'#2e241d',side:THREE.BackSide})));
  const pm=new THREE.MeshBasicMaterial({color:day?'#ffffff':'#ffb874'});
  const pp=[[0,2.3,-5.9,0],[5.9,1.5,0,-Math.PI/2],[-3,2.4,3,Math.PI]];
  for(const [x,y,z,r] of pp){const p=new THREE.Mesh(new THREE.PlaneGeometry(day?5:1.6,day?2.5:.8),pm);p.position.set(x,y,z);p.rotation.y=r;s.add(p);}
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.MeshBasicMaterial({color:day?'#9c8f7f':'#3a2d24'}));fl.rotation.x=-Math.PI/2;fl.position.y=-2.4;s.add(fl);
  return pmrem.fromScene(s,.04).texture;}
const ENV={eve:makeEnv(false),day:makeEnv(true)};
scene.environment=ENV.eve;

/* ---------- geometry helpers ---------- */
function worldUV(geo,w,h,d){const uv=geo.attributes.uv;const dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let i=0;i<4;i++){const k=f*4+i;uv.setXY(k,uv.getX(k)*dims[f][0],uv.getY(k)*dims[f][1]);}uv.needsUpdate=true;return geo;}
function bb(x0,x1,y0,y1,z0,z1,m,parent=scene){const a=Math.min(x0,x1),b=Math.max(x0,x1),c=Math.min(y0,y1),d=Math.max(y0,y1),e=Math.min(z0,z1),f=Math.max(z0,z1);
  const w=Math.max(b-a,1e-4),h=Math.max(d-c,1e-4),dd=Math.max(f-e,1e-4);
  const me=new THREE.Mesh(worldUV(new THREE.BoxGeometry(w,h,dd),w,h,dd),m);me.position.set((a+b)/2,(c+d)/2,(e+f)/2);parent.add(me);return me;}
function rrShape(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;r=Math.max(Math.min(r,w/2-1e-4,h/2-1e-4),1e-4);
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;}

function buildRoom(id){const R=ROOMS[id],{x0,x1,z0,z1}=R;

  for(const s of sides){const ops=[];
    for(const d of DOORS)if(d.axis===s.axis&&Math.abs(d.line-s.edge)<.02&&d.c1>s.a&&d.c0<s.b)ops.push({c0:d.c0,c1:d.c1,y0:0,y1:2.02});

  if(R.slope){const cuts=[];for(const w of (R.windows||[]))if(w.side===R.slope.side)cuts.push([w.c-w.w/2-.12,w.c+w.w/2+.12]);buildSlope(R,cuts);}}

function buildSlope(R,cuts){const {x0,x1,z0,z1}=R,{side,k,r}=R.slope;
  const along=(side==='n'||side==='s')?[x0,x1]:[z0,z1];
  const P=(c,y,off)=>side==='n'?[c,y,z0+off]:side==='s'?[c,y,z1-off]:side==='w'?[x0+off,y,c]:[x1-off,y,c];
  let ranges=[along];
  for(const cut of cuts)ranges=ranges.flatMap(([a,b])=>cut[1]<=a||cut[0]>=b?[[a,b]]:[[a,cut[0]],[cut[1],b]].filter(([p,q])=>q-p>.001));

  for(const cut of cuts)for(const c of cut)poly([P(c,k,0),P(c,H,0),P(c,H,r)],M.slope,slopeGroup);}

function setMood(m){mood=m;const day=m==='day';
  scene.background=new THREE.Color(day?'#cfd6da':'#0e0c0b');
  hemi.intensity=day?.9:.18;hemi.color.set(day?'#f4f7fb':'#ffe6c8');hemi.groundColor.set(day?'#8e7f6f':'#3b3028');
  sun.intensity=day?.55:0;
  for(const L of lamps)L.l.intensity=L.base*(day?.15:.8);
  for(const G of glows)G.m.opacity=G.base*(day?.12:1);
  M.sky.map=day?TX.skyD:TX.skyE;M.sky.needsUpdate=true;
  scene.environment=day?ENV.day:ENV.eve;
  for(const k in M){const mm=M[k];if(mm.isMeshStandardMaterial)mm.envMapIntensity=day?.5:.2;}
  renderer.toneMappingExposure=day?.95:.8;
  document.getElementById('lEve').setAttribute('aria-pressed',String(!day));document.getElementById('lDay').setAttribute('aria-pressed',String(day));}
setMood('eve');

/* ---------- walkable areas ---------- */
const WALK=[];
for(const id of ORDER){const R=ROOMS[id];let [a,b,c,d]=[R.x0+.2,R.x1-.2,R.z0+.2,R.z1-.2];
  if(R.slope){const s=R.slope,need=1.78;const m=s.k<need?s.r*(need-s.k)/(H-s.k)+.12:.2;
    if(s.side==='n')c=R.z0+m;if(s.side==='s')d=R.z1-m;if(s.side==='w')a=R.x0+m;if(s.side==='e')b=R.x1-m;}
  WALK.push([a,b,c,d]);}
for(const d of DOORS){if(d.outer)continue;if(d.axis==='x')WALK.push([d.c0+.14,d.c1-.14,d.line-.45,d.line+.45]);else WALK.push([d.line-.45,d.line+.45,d.c0+.14,d.c1-.14]);}
const RAD=.16;
function walkable(x,z){return WALK.some(r=>x>r[0]&&x<r[1]&&z>r[2]&&z<r[3])&&!BLK.some(b=>x>b[0]-RAD&&x<b[1]+RAD&&z>b[2]-RAD&&z<b[3]+RAD);}
function roomAt(x,z){if(x>=NICHE.x0-.05&&x<=NICHE.x1&&z>=NICHE.z0&&z<=NICHE.z1)return 'wohn';
  for(const id of ORDER){const R=ROOMS[id];if(x>=R.x0-.05&&x<=R.x1+.05&&z>=R.z0-.05&&z<=R.z1+.05)return id;}return null;}

/* ---------- camera state ---------- */
const st={mode:'walk',pos:V(5.95,EYE,1.75),yaw:0,pitch:-.06,tgt:V(5.2,0,.9),theta:.38,phi:.72,radius:15,room:'wohn',topRoom:null};
function walkPose(){const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(st.pitch,st.yaw,0,'YXZ'));return {p:st.pos.clone(),q};}
function topPose(){const p=V(st.tgt.x+st.radius*Math.sin(st.phi)*Math.sin(st.theta),st.radius*Math.cos(st.phi),st.tgt.z+st.radius*Math.sin(st.phi)*Math.cos(st.theta));
  const m=new THREE.Matrix4().lookAt(p,st.tgt,UP);return {p,q:new THREE.Quaternion().setFromRotationMatrix(m)};}
function applyPose(P){camera.position.copy(P.p);camera.quaternion.copy(P.q);}
let tween=null;const CUT=new THREE.Plane(V(0,-1,0),1.55);
function tweenTo(P,dur,done){if(reduceMotion||dur<=0){applyPose(P);done&&done();return;}
  tween={p0:camera.position.clone(),q0:camera.quaternion.clone(),P,t0:performance.now(),dur,done};}
function fadeTo(fn){const f=document.getElementById('fade');if(reduceMotion){fn();return;}f.style.opacity='1';setTimeout(()=>{fn();requestAnimationFrame(()=>{f.style.opacity='0';});},230);}
function overviewRadius(){const a=camera.aspect;return Math.min(34,a<1?16/Math.max(a,.42)*.62:16);}
function setFov(){const a=camera.aspect;camera.fov=st.mode==='walk'?Math.min(96,Math.max(66,2*Math.atan(Math.tan(37*Math.PI/180)/a)*180/Math.PI)):45;camera.updateProjectionMatrix();}

function goRoom(id){const R=ROOMS[id];
  if(st.mode==='walk'){const v=R.view;fadeTo(()=>{st.pos.set(v.x,EYE,v.z);st.yaw=Math.atan2(-(v.lx-v.x),-(v.lz-v.z));st.pitch=-.07;tween=null;applyPose(walkPose());setRoom(id);});}
  else{st.topRoom=id;const cx=id==='wohn'?(R.x0+NICHE.x1)/2:(R.x0+R.x1)/2;st.tgt.set(cx,0,(R.z0+R.z1)/2);st.radius=R.top.r*(camera.aspect<1?1.45:1);st.phi=.62;
    tweenTo(topPose(),900);setRoom(id);}}
function setMode(m){if(m===st.mode)return;st.mode=m;
  document.getElementById('mWalk').setAttribute('aria-pressed',String(m==='walk'));document.getElementById('mTop').setAttribute('aria-pressed',String(m==='top'));
  ceilGroup.visible=slopeGroup.visible=(m==='walk');renderer.clippingPlanes=m==='top'?[CUT]:[];setFov();
  if(m==='top'){st.tgt.set(5.25,0,.85);st.radius=overviewRadius();st.phi=.55;st.theta=.3;st.topRoom=null;tweenTo(topPose(),1100);}
  else{tweenTo(walkPose(),1000);setRoom(roomAt(st.pos.x,st.pos.z)||'flur');}
  updateHint();updateCard();}

/* ---------- UI ---------- */
const roomsNav=document.getElementById('rooms');
for(const id of ORDER){const R=ROOMS[id];const b=document.createElement('button');b.className='chip glass';b.dataset.id=id;b.setAttribute('aria-pressed','false');
  b.innerHTML=`<span class="sw" style="background:${R.color}"></span>${R.name}<small>${R.area} m²</small>`;b.addEventListener('click',()=>{hideHint();goRoom(id);});roomsNav.appendChild(b);}
function setRoom(id){if(!id||id===st.room)return;st.room=id;updateCard();}
function updateCard(){const R=ROOMS[st.room]||ROOMS.wohn;
  document.getElementById('rName').textContent=R.name;document.getElementById('rDims').textContent=R.dims;document.getElementById('rItems').textContent=R.items;
  document.getElementById('enter').hidden=!(st.mode==='top'&&st.topRoom);
  for(const b of roomsNav.children)b.setAttribute('aria-pressed',String(b.dataset.id===st.room));}
document.getElementById('enter').addEventListener('click',()=>{const id=st.topRoom||st.room;const v=ROOMS[id].view;
  st.pos.set(v.x,EYE,v.z);st.yaw=Math.atan2(-(v.lx-v.x),-(v.lz-v.z));st.pitch=-.07;setMode('walk');});
document.getElementById('mWalk').addEventListener('click',()=>setMode('walk'));
document.getElementById('mTop').addEventListener('click',()=>setMode('top'));
document.getElementById('lEve').addEventListener('click',()=>setMood('eve'));
document.getElementById('lDay').addEventListener('click',()=>setMood('day'));
const hint=document.getElementById('hint');let hintHidden=false;
function hideHint(){if(!hintHidden){hintHidden=true;setTimeout(()=>hint.classList.add('off'),1800);}}
function updateHint(){hint.textContent=st.mode==='walk'?'Ziehen zum Umschauen · auf den Boden tippen zum Hinlaufen · WASD / Pfeiltasten':'Ziehen zum Drehen · Zoomen mit Mausrad oder zwei Fingern · Raum antippen';hint.classList.remove('off');hintHidden=false;}

// room labels for the top view
const labelsEl=document.getElementById('labels');const LBL={};
for(const id of ORDER){const R=ROOMS[id];const d=document.createElement('div');d.className='lbl glass';d.innerHTML=`<b>${R.name}</b><span>${R.area} m²</span>`;d.hidden=true;
  d.addEventListener('click',()=>goRoom(id));labelsEl.appendChild(d);LBL[id]=d;}
const tmpV=new THREE.Vector3();
function updateLabels(){const show=st.mode==='top'&&!tween;
  for(const id of ORDER){const d=LBL[id];if(!show){d.hidden=true;continue;}const R=ROOMS[id];
    tmpV.set(id==='wohn'?(R.x0+R.x1)/2:(R.x0+R.x1)/2,.3,(R.z0+R.z1)/2).project(camera);
    if(tmpV.z>1){d.hidden=true;continue;}d.hidden=false;d.style.transform=`translate(${(tmpV.x*.5+.5)*innerWidth}px,${(-tmpV.y*.5+.5)*innerHeight}px) translate(-50%,-50%)`;}}

// minimap
const map=document.getElementById('map'),mctx=map.getContext('2d');const MB={x0:-.35,x1:10.9,z0:-4.0,z1:5.85};
function mapScale(){const w=map.clientWidth,h=map.clientHeight;const s=Math.min((w-12)/(MB.x1-MB.x0),(h-12)/(MB.z1-MB.z0));return {s,ox:(w-s*(MB.x1-MB.x0))/2,oy:(h-s*(MB.z1-MB.z0))/2,w,h};}
function drawMap(){const dpr=Math.min(devicePixelRatio||1,2);const {s,ox,oy,w,h}=mapScale();
  if(map.width!==Math.round(w*dpr)){map.width=Math.round(w*dpr);map.height=Math.round(h*dpr);}
  mctx.setTransform(dpr,0,0,dpr,0,0);mctx.clearRect(0,0,w,h);
  const X=x=>ox+(x-MB.x0)*s,Z=z=>oy+(z-MB.z0)*s;
  const rect=(x0,x1,z0,z1,fill,stroke)=>{mctx.fillStyle=fill;mctx.fillRect(X(x0),Z(z0),(x1-x0)*s,(z1-z0)*s);if(stroke){mctx.strokeStyle=stroke;mctx.lineWidth=1;mctx.strokeRect(X(x0)+.5,Z(z0)+.5,(x1-x0)*s-1,(z1-z0)*s-1);}};
  for(const id of ORDER){const R=ROOMS[id],on=id===st.room;rect(R.x0,R.x1,R.z0,R.z1,on?'rgba(227,170,99,.32)':'rgba(243,236,226,.08)',on?'rgba(227,170,99,.9)':'rgba(243,236,226,.28)');}
  rect(NICHE.x0,NICHE.x1,NICHE.z0,NICHE.z1,st.room==='wohn'?'rgba(227,170,99,.32)':'rgba(243,236,226,.08)');
  if(w>140){mctx.fillStyle='rgba(243,236,226,.6)';mctx.font='500 9px Inter,system-ui,sans-serif';mctx.textAlign='center';mctx.textBaseline='middle';
    for(const id of ORDER){if(id==='flur')continue;const R=ROOMS[id];mctx.fillText(R.name.replace('zimmer','.'),X((R.x0+R.x1)/2),Z((R.z0+R.z1)/2));}}
  const p=st.mode==='walk'?st.pos:st.tgt;const px=X(p.x),pz=Z(p.z);
  if(st.mode==='walk'){const a=Math.atan2(-Math.cos(st.yaw),-Math.sin(st.yaw));mctx.fillStyle='rgba(227,170,99,.35)';mctx.beginPath();mctx.moveTo(px,pz);
    mctx.arc(px,pz,22,a-.6,a+.6);mctx.closePath();mctx.fill();}
  mctx.fillStyle='#e3aa63';mctx.beginPath();mctx.arc(px,pz,3.6,0,7);mctx.fill();mctx.strokeStyle='#110f0d';mctx.lineWidth=1.5;mctx.stroke();}
map.addEventListener('click',e=>{const r=map.getBoundingClientRect();const {s,ox,oy}=mapScale();const x=MB.x0+(e.clientX-r.left-ox)/s,z=MB.z0+(e.clientY-r.top-oy)/s;hideHint();
  if(st.mode==='top'){const id=roomAt(x,z);if(id)goRoom(id);return;}
  if(walkable(x,z))fadeTo(()=>{st.pos.set(x,EYE,z);tween=null;applyPose(walkPose());setRoom(roomAt(x,z));});else{const id=roomAt(x,z);if(id)goRoom(id);}});

/* ---------- input ---------- */
const keys=new Set();
addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;const k=e.key.toLowerCase();
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','q','e'].includes(k)){keys.add(k);e.preventDefault();hideHint();}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
const ptrs=new Map();let drag=null,pinch=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};
  else if(ptrs.size===2){drag=null;const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};}canvas.classList.add('dragging');});
canvas.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(st.mode==='top'){st.radius=Math.max(3.5,Math.min(32,st.radius*pinch.d/d));tween=null;applyPose(topPose());}pinch.d=d;return;}
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;drag.moved+=Math.abs(dx)+Math.abs(dy);
  if(drag.moved<4)return;tween=null;hideHint();
  if(st.mode==='walk'){st.yaw+=dx*.0045;st.pitch=Math.max(-1.2,Math.min(1.2,st.pitch+dy*.0045));applyPose(walkPose());}
  else{st.theta-=dx*.006;st.phi=Math.max(.12,Math.min(1.22,st.phi-dy*.005));applyPose(topPose());}});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(drag&&ptrs.size===0){if(drag.moved<8&&performance.now()-drag.t<500)tap(e.clientX,e.clientY);drag=null;}
  if(ptrs.size===0)canvas.classList.remove('dragging');}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{e.preventDefault();hideHint();tween=null;
  if(st.mode==='top'){st.radius=Math.max(3.5,Math.min(32,st.radius*Math.exp(e.deltaY*.0012)));applyPose(topPose());}
  else{const s=-Math.sign(e.deltaY)*.35;tryMove(-Math.sin(st.yaw)*s,-Math.cos(st.yaw)*s);applyPose(walkPose());}},{passive:false});
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
const marker=new THREE.Mesh(new THREE.RingGeometry(.13,.17,40).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:'#e3aa63',transparent:true,opacity:0,depthWrite:false}));
marker.position.y=.02;marker.raycast=noPick;scene.add(marker);let markerT=0;
function tap(cx,cy){ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(scene.children,true).filter(h=>h.object.visible&&h.object.parent&&(h.object.parent.visible!==false));
  if(!hits.length)return;const p=hits[0].point;
  if(st.mode==='top'){const id=roomAt(p.x,p.z);if(id)goRoom(id);return;}
  let x=p.x,z=p.z;if(!walkable(x,z)){const dx=x-st.pos.x,dz=z-st.pos.z,L=Math.hypot(dx,dz);let ok=false;
    for(let t=L-.2;t>.3;t-=.1){const xx=st.pos.x+dx/L*t,zz=st.pos.z+dz/L*t;if(walkable(xx,zz)){x=xx;z=zz;ok=true;break;}}if(!ok)return;}
  marker.position.x=x;marker.position.z=z;markerT=performance.now();
  let clear=true;const L=Math.hypot(x-st.pos.x,z-st.pos.z);for(let t=0;t<=1;t+=.1/Math.max(L,.1))if(!walkable(st.pos.x+(x-st.pos.x)*t,st.pos.z+(z-st.pos.z)*t)){clear=false;break;}
  if(clear){st.pos.set(x,EYE,z);tweenTo(walkPose(),Math.min(1400,300+L*380));}
  else fadeTo(()=>{st.pos.set(x,EYE,z);tween=null;applyPose(walkPose());});
  setRoom(roomAt(x,z));}
function tryMove(dx,dz){const nx=st.pos.x+dx,nz=st.pos.z+dz;
  if(walkable(nx,nz)){st.pos.x=nx;st.pos.z=nz;}else if(walkable(nx,st.pos.z))st.pos.x=nx;else if(walkable(st.pos.x,nz))st.pos.z=nz;}

/* ---------- loop ---------- */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;setFov();if(!tween)applyPose(st.mode==='walk'?walkPose():topPose());}
addEventListener('resize',resize);
let last=performance.now(),frame=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;frame++;
  if(st.mode==='walk'&&keys.size){tween=null;const sp=1.7*dt;const f=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0);
    const sd=(keys.has('d')?1:0)-(keys.has('a')?1:0);const turn=(keys.has('arrowleft')||keys.has('q')?1:0)-(keys.has('arrowright')||keys.has('e')?1:0);
    st.yaw+=turn*1.8*dt;const fx=-Math.sin(st.yaw),fz=-Math.cos(st.yaw),rx=Math.cos(st.yaw),rz=-Math.sin(st.yaw);
    if(f||sd)tryMove((fx*f+rx*sd)*sp,(fz*f+rz*sd)*sp);applyPose(walkPose());const r=roomAt(st.pos.x,st.pos.z);if(r)setRoom(r);}
  if(tween){const k=Math.min(1,(now-tween.t0)/tween.dur),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(tween.p0,tween.P.p,e);camera.quaternion.copy(tween.q0).slerp(tween.P.q,e);
    if(k>=1){const d=tween.done;tween=null;d&&d();}}
  if(markerT){const a=(now-markerT)/900;marker.material.opacity=a<1?.9*(1-a):0;if(a>=1)markerT=0;}
  updateLabels();if(frame%3===0)drawMap();
  renderer.render(scene,camera);requestAnimationFrame(loop);}

// start: hash can open a room or the top view
const hashMap={};for(const id of ORDER)hashMap[ROOMS[id].key]=id;
function fromHash(){const h=(location.hash||'').slice(1);if(h==='von-oben'){setMode('top');return true;}const id=hashMap[h];if(id){const v=ROOMS[id].view;
  st.pos.set(v.x,EYE,v.z);st.yaw=Math.atan2(-(v.lx-v.x),-(v.lz-v.z));if(st.mode==='walk')applyPose(walkPose());setRoom(id);return true;}return false;}
addEventListener('hashchange',fromHash);
const v0=ROOMS.wohn.view;st.yaw=Math.atan2(-(v0.lx-v0.x),-(v0.lz-v0.z));
resize();fromHash();applyPose(st.mode==='walk'?walkPose():topPose());updateCard();
document.getElementById('loading').remove();
requestAnimationFrame(loop);
})();
</script>

</html>
